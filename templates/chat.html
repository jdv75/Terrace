<!DOCTYPE html>
<html>
<head>
    <title>Chat WhatsApp</title>

    <style>
        * {
            box-sizing: border-box;
            font-family: "Segoe UI", Arial, sans-serif;
        }

        body {
            margin: 0;
            background: #f3f4f6;
            color: #111827;
        }

        .header {
            background: #111827;
            color: white;
            padding: 22px 35px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 14px rgba(0,0,0,.18);
        }

        .header h1 {
            margin: 0;
            font-size: 24px;
        }

        .nav a {
            color: #d1d5db;
            text-decoration: none;
            margin-left: 18px;
            font-weight: 500;
        }

        .nav a:hover {
            color: white;
        }

        .chat-container {
            width: 90%;
            max-width: 900px;
            margin: 35px auto;
            background: white;
            border-radius: 18px;
            box-shadow: 0 10px 28px rgba(0,0,0,.08);
            overflow: hidden;
        }

        #messages {
            padding: 25px;
            height: 560px;
            overflow-y: auto;
            background: #f9fafb;
        }

        .message {
            margin: 12px 0;
            padding: 13px 15px;
            border-radius: 16px;
            max-width: 70%;
            line-height: 1.4;
            box-shadow: 0 3px 8px rgba(0,0,0,.06);
        }

        .message p {
            margin: 0 0 6px;
            font-size: 15px;
        }

        .message small {
            display: block;
            font-size: 11px;
            color: #6b7280;
            text-align: right;
        }

        .out {
            background: #dcfce7;
            margin-left: auto;
            border-bottom-right-radius: 4px;
        }

        .in {
            background: #e5e7eb;
            margin-right: auto;
            border-bottom-left-radius: 4px;
        }

        .form-box {
            padding: 20px;
            background: white;
            border-top: 1px solid #e5e7eb;
        }

        textarea {
            width: 100%;
            height: 95px;
            resize: none;
            border: 1px solid #d1d5db;
            border-radius: 14px;
            padding: 14px;
            font-size: 15px;
            outline: none;
        }

        textarea:focus {
            border-color: #22c55e;
            box-shadow: 0 0 0 3px rgba(34,197,94,.15);
        }

        button {
            margin-top: 12px;
            width: 100%;
            background: #16a34a;
            color: white;
            border: none;
            padding: 14px;
            border-radius: 14px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
        }

        button:hover {
            background: #15803d;
        }
    </style>
</head>

<body>

    <div class="header">
        <h1>Chat con {{ telefono }}</h1>

        <div class="nav">
            <a href="/dashboard">← Dashboard</a>
            <a href="/inbox">Inbox</a>
        </div>
    </div>

    <div class="chat-container">

        <div id="messages">
            {% for m in mensajes %}
                <div class="message {% if m.direccion == 'out' %}out{% else %}in{% endif %}">
                    <p>{{ m.mensaje }}</p>
                    <small>{{ m.fecha }}</small>
                </div>
            {% endfor %}
        </div>

        <form action="/manual/send" method="post" class="form-box">
            <input type="hidden" name="telefono" value="{{ telefono }}">

            <textarea name="mensaje" placeholder="Escribe tu respuesta..." required></textarea>

            <button type="submit">Enviar por WhatsApp</button>
        </form>

    </div>

    <script>
        setInterval(() => {
            fetch("/chat/{{ telefono }}/messages")
                .then(response => response.text())
                .then(html => {
                    document.getElementById("messages").innerHTML = html;
                });
        }, 3000);
    </script>

</body>
</html>
