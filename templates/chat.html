<!DOCTYPE html>
<html>
<head>
    <title>Chat WhatsApp</title>
</head>
<body>
    <h1>Chat con {{ telefono }}</h1>

    <a href="/dashboard">← Dashboard</a> |
    <a href="/inbox">Inbox</a>

    <div id="messages" style="margin-top:20px;">
        {% for m in mensajes %}
            <div style="
                margin:10px;
                padding:10px;
                border-radius:10px;
                max-width:60%;
                {% if m.direccion == 'out' %}
                    background:#d1fae5; margin-left:auto;
                {% else %}
                    background:#e5e7eb;
                {% endif %}
            ">
                <p>{{ m.mensaje }}</p>
                <small>{{ m.fecha }}</small>
            </div>
        {% endfor %}
    </div>

    <form action="/manual/send" method="post" style="margin-top:20px;">
        <input type="hidden" name="telefono" value="{{ telefono }}">
        <textarea name="mensaje" placeholder="Escribe tu respuesta..." required style="width:100%; height:100px;"></textarea>
        <br>
        <button type="submit">Enviar por WhatsApp</button>
    </form>

    <script>
        setInterval(() => {
            fetch("/chat/{{ telefono }}/messages")
                .then(response => response.text())
                .then(html => {
                    document.getElementById("messages").innerHTML = html;
                });
        }, 3000);
    </script>
</body>
</html>
