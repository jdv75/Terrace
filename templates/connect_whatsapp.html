<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conectar WhatsApp | Terrace</title>

    <style>
        * {
            box-sizing: border-box;
            font-family: "Segoe UI", Arial, sans-serif;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            background: #f3f4f6;
        }

        .box {
            width: min(560px, 92%);
            background: white;
            padding: 34px;
            border-radius: 18px;
            box-shadow: 0 12px 32px rgba(0, 0, 0, 0.10);
            text-align: center;
        }

        h1 {
            margin-top: 0;
            color: #111827;
        }

        p {
            color: #4b5563;
            line-height: 1.55;
        }

        button {
            border: 0;
            background: #16a34a;
            color: white;
            padding: 14px 22px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
        }

        button:disabled {
            opacity: 0.6;
            cursor: wait;
        }

        #status {
            margin-top: 18px;
            font-weight: 600;
        }

        a {
            display: inline-block;
            margin-top: 22px;
            color: #2563eb;
            text-decoration: none;
        }
    </style>
</head>

<body>
<div class="box">
    <h1>Conectar WhatsApp Business</h1>

    <p>
        Inicia el registro insertado de Meta para autorizar
        la cuenta de WhatsApp Business.
    </p>

    <button
        id="connectBtn"
        type="button"
        onclick="launchWhatsAppSignup()"
        disabled
    >
        Cargando Meta...
    </button>

    <div id="status"></div>

    <a href="/dashboard">← Volver al dashboard</a>
</div>

<script>
    let embeddedSession = null;
    let metaSdkReady = false;

    const statusBox = document.getElementById("status");
    const connectBtn = document.getElementById("connectBtn");

    window.addEventListener("message", function (event) {
        if (
            event.origin !== "https://www.facebook.com" &&
            event.origin !== "https://web.facebook.com"
        ) {
            return;
        }

        let data = event.data;

        try {
            if (typeof data === "string") {
                data = JSON.parse(data);
            }
        } catch (error) {
            return;
        }

        if (data && data.type === "WA_EMBEDDED_SIGNUP") {
            console.log("Evento Embedded Signup:", data);

            if (data.event === "FINISH") {
                embeddedSession = data;
            }

            if (data.event === "CANCEL") {
                statusBox.textContent =
                    "El registro fue cancelado en el paso: " +
                    (data.data?.current_step || "desconocido");

                connectBtn.disabled = false;
            }

            if (data.event === "ERROR") {
                statusBox.textContent =
                    "Meta informó un error durante el registro.";

                connectBtn.disabled = false;
            }
        }
    });

    window.fbAsyncInit = function () {
        try {
            FB.init({
                appId: {{ meta_app_id | tojson }},
                cookie: true,
                xfbml: true,
                version: {{ meta_graph_version | tojson }}
            });

            metaSdkReady = true;
            connectBtn.disabled = false;
            connectBtn.textContent = "Conectar WhatsApp";
            statusBox.textContent = "";

            console.log("SDK de Meta inicializado correctamente");
        } catch (error) {
            console.error("Error inicializando Meta:", error);

            statusBox.textContent =
                "❌ El SDK de Meta cargó, pero no pudo inicializarse.";
        }
    };

    function launchWhatsAppSignup() {
        if (!metaSdkReady || typeof FB === "undefined") {
            statusBox.textContent =
                "❌ Meta todavía no ha cargado. Recarga la página.";

            connectBtn.disabled = false;
            return;
        }

        statusBox.textContent = "Abriendo Meta...";
        connectBtn.disabled = true;

        try {
            FB.login(
                function (response) {
                    console.log("Respuesta de FB.login:", response);

                    processLoginResponse(response);
                },
                {
                    config_id: {{ meta_config_id | tojson }},
                    response_type: "code",
                    override_default_response_type: true,
                    extras: {
                        setup: {},
                        sessionInfoVersion: "3"
                    }
                }
            );
        } catch (error) {
            console.error("Error abriendo FB.login:", error);

            statusBox.textContent =
                "❌ No se pudo abrir Meta: " + error.message;

            connectBtn.disabled = false;
        }
    }

    async function processLoginResponse(response) {
        if (
            !response ||
            !response.authResponse ||
            !response.authResponse.code
        ) {
            statusBox.textContent =
                "El proceso fue cancelado o Meta no devolvió autorización.";

            connectBtn.disabled = false;
            return;
        }

        statusBox.textContent = "Guardando la conexión...";

        try {
            const result = await fetch(
                "/embedded-signup/callback",
                {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        code: response.authResponse.code,
                        session: embeddedSession
                    })
                }
            );

            const data = await result.json();

            if (!result.ok) {
                throw new Error(
                    data.detail
                        ? JSON.stringify(data.detail)
                        : "Error desconocido"
                );
            }

            statusBox.textContent =
                "✅ WhatsApp conectado correctamente.";

            console.log("Cuenta conectada:", data);

        } catch (error) {
            console.error("Error guardando conexión:", error);

            statusBox.textContent =
                "❌ No se pudo guardar la conexión: " +
                error.message;

            connectBtn.disabled = false;
        }
    }
</script>

<script
    async
    defer
    crossorigin="anonymous"
    src="https://connect.facebook.net/en_US/sdk.js"
    onerror="
        document.getElementById('status').textContent =
        '❌ No se pudo descargar el SDK de Meta. Revisa bloqueadores y configuración del dominio.';
        document.getElementById('connectBtn').textContent =
        'Error cargando Meta';
    "
></script>
</body>
</html>
