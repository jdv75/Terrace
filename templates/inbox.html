<!DOCTYPE html>
<html>
<head>
    <title>Inbox WhatsApp</title>

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:"Segoe UI",Arial,sans-serif;
        }

        body{
            background:#f3f4f6;
        }

        header {
            background:#111827;
            color:white;
            padding:25px 40px;
            box-shadow:0 4px 15px rgba(0,0,0,.15);

            display:flex;
            justify-content:space-between;
            align-items:center;
        }

        header h1{
            font-size:28px;
            margin:0;
        }

        .container{
            width:90%;
            max-width:900px;
            margin:35px auto;
        }

        .chat-list{
            background:white;
            border-radius:18px;
            overflow:hidden;
            box-shadow:0 10px 30px rgba(0,0,0,.08);
        }

        .chat{
            display:flex;
            align-items:center;
            padding:20px;
            border-bottom:1px solid #ececec;
            transition:.25s;
            text-decoration:none;
            color:#111827;
        }

        .chat:last-child{
            border-bottom:none;
        }

        .chat:hover{
            background:#f9fafb;
        }

        .avatar{
            width:55px;
            height:55px;
            border-radius:50%;
            background:#22c55e;
            color:white;
            display:flex;
            justify-content:center;
            align-items:center;
            font-size:22px;
            font-weight:bold;
            margin-right:18px;
            flex-shrink:0;
        }

        .info{
            flex:1;
        }

        .nombre{
            font-size:18px;
            font-weight:600;
            margin-bottom:5px;
        }

        .telefono{
            color:#6b7280;
            font-size:14px;
            margin-bottom:6px;
        }

        .fecha{
            color:#9ca3af;
            font-size:13px;
        }

        .dashboard-btn{
            text-decoration:none;
            background:#22c55e;
            color:white;
            padding:10px 18px;
            border-radius:10px;
            font-weight:600;
            transition:.25s;
        }

        .dashboard-btn:hover{
            background:#16a34a;
        }

        .badge{
            background:#ef4444;
            color:white;
            min-width:26px;
            height:26px;
            padding:0 8px;
            border-radius:999px;
            display:flex;
            align-items:center;
            justify-content:center;
            font-size:13px;
            font-weight:700;
            margin-left:15px;
        }
    </style>
</head>

<body>

<header>

    <h1>Inbox de WhatsApp</h1>

    <a href="/dashboard" class="dashboard-btn">
        ← Volver al Dashboard
    </a>

</header>

<div class="container">

    <div class="chat-list" id="chat-list">

        {% for chat in chats %}

        <a class="chat" href="/chat/{{ chat.telefono }}">

            <div class="avatar">
                {{ (chat.nombre or chat.telefono)[0]|upper }}
            </div>

            <div class="info">

                <div class="nombre">
                    {{ chat.nombre or chat.telefono }}
                </div>

                <div class="telefono">
                    {{ chat.telefono }}
                </div>

                <div class="fecha">
                    Último mensaje: {{ chat.ultima_fecha }}
                </div>

            </div>

            {% if chat.no_leidos > 0 %}
                    <div class="badge">
                        {{ chat.no_leidos }}
                    </div>
            {% endif %}

        </a>

        {% endfor %}

    </div>

</div>

<script>

let unreadAnterior = 0;
let primeraCarga = true;

function reproducirSonido() {
    const audio = new Audio("/static/notification.mp3");

    audio.play().catch(() => {
        // El navegador puede bloquear el sonido hasta que el usuario interactúe con la página.
    });
}

function actualizarInbox() {

    fetch("/inbox/chats")
        .then(response => response.text())
        .then(html => {

            document.getElementById("chat-list").innerHTML = html;

            let unreadActual = 0;

            document.querySelectorAll(".badge").forEach(badge => {
                unreadActual += parseInt(badge.innerText) || 0;
            });

            if (!primeraCarga && unreadActual > unreadAnterior) {
                reproducirSonido();
            }

            unreadAnterior = unreadActual;
            primeraCarga = false;

        });

}

actualizarInbox();

setInterval(actualizarInbox, 3000);

</script>

</body>
</html>
